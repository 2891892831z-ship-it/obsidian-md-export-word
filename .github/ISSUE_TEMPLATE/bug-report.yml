name: Bug report
description: 报告可复现的导出、格式、引用或安装问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请运行环境自检，并删除论文敏感内容、Token 和个人路径。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian 版本
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows 版本
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 引用模式
      options:
        - 严格模式
        - 兼容模式
        - 尚未进入模式选择
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用最小化 Markdown；不要上传未公开论文全文。
      placeholder: |
        1. 打开……
        2. 运行……
        3. 选择……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: 环境自检与日志
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除 Token、API Key、私人路径和未公开论文内容。
          required: true
