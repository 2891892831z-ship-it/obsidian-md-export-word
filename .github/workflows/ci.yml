name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/requirements.txt

      - name: Test language-aware quote fonts
        run: python scripts/test-quote-fonts.py

      - name: Test image spacing and figure citation counts
        run: python scripts/test-image-spacing.py

      - name: Check source
        run: npm run check

      - name: Build plugin
        run: npm run build

      - name: Verify release assets exist
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
